name: Playwright Tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
      - main

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Python setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libfreetype6-dev pkg-config

      - name: Install Python dependencies
        run: |
          pip install -r requirements1.txt -r requirements2.txt
          PIP_NO_BUILD_ISOLATION=false pip install -r requirements3.txt

      - name: Set PYTHONPATH
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}/src" >> $GITHUB_ENV

      # Node / Playwright setup
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Start server
      - name: Start web interface
        run: |
          python web_interface/main.py > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for web interface
        run: |
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:5000 > /dev/null; then
              echo "Web interface is up"
              exit 0
            fi

            echo "Waiting for web interface..."
            sleep 1
          done

          echo "Web interface did not start"
          cat server.log
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload server log
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: server-log
          path: server.log
          retention-days: 30

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30